 button{width:35px;height:35px;border-radius:50%;border:0;color:#6432af;background:#eee6fe;font-weight:800}.stepper button.active{color:white;background:#893ce0}.stepper button.done{background:#b9f5e7;color:#138d7e}.empty{padding:17px;background:#f7f3ff;border-radius:13px;font-size:14px;color:#654c87}.footer{margin-top:28px;color:#807396;font-size:12px;line-height:1.5}.sideToggle{display:none}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid #c8b6ee;border-radius:13px;padding:9px 12px;background:#fff;color:#67359f;font-weight:800}.tabs button.active{background:#8c46df;color:white}.sourceBlock{padding:15px 0;border-top:1px solid #e6dff4}.sourceBlock:first-child{border-top:0}.sourceBlock h3{color:#59249b;font-size:16px;margin:0 0 10px}.chipflag{background:#ffeed4;color:#9c620f}.smallFoot{font-size:12px;color:#76668c;margin:8px 0}.subtle{color:#66577c}@media(max-width:1180px){.modules{grid-template-columns:repeat(2,1fr)}.heroGrid{grid-template-columns:1fr}.hero{min-height:190px}.twoColumns{grid-template-columns:1fr 1fr}.sidebar{width:188px}.layout{grid-template-columns:188px minmax(0,1fr)}}@media(max-width:760px){.layout{display:block}.sidebar{position:relative;width:auto;height:auto;padding:8px 13px}.side-scene{display:none}.sideNav{display:flex;overflow-x:auto;gap:4px}.nav{width:auto;white-space:nowrap;padding:9px 11px;font-size:12px}.nav .ico{font-size:17px}.site{padding:9px 12px 35px}.masthead{min-height:65px}.logoMark{font-size:28px}.logo b{font-size:19px}.logo small{font-size:12px}.profile{padding:8px;font-size:11px}.hero{padding:23px 17px}.heroArt{opacity:.3}.hero h1{font-size:31px}.modules{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.modVisual{height:110px}.modVisual img{height:76%}.module h3{font-size:14px}.moduleBody{padding:9px}.twoColumns{grid-template-columns:1fr}.unitHero{grid-template-columns:1fr 110px}.unitArt{height:95px}.scoreHero{flex-direction:column;align-items:start}.statBoard{grid-template-columns:1fr  .choice.answer-wrong,.miniStatement.answer-wrong{border:2px solid #e54b58!important;background:#fff0f1!important;color:#8f1a29!important}.choice.answer-correct,.miniStatement.answer-correct{border:2px solid #23a876!important;background:#e9fbf1!important;color:#175d46!important}.feedback.feedback-wrong{background:#ffe3e7!important;border:1px solid #e94f61!important;color:#9f1834!important}.feedback.feedback-correct{background:#e0faed!important;border:1px solid #24ad78!important;color:#135c43!important}</style></head><body><div class="layout"><aside class="sidebar"><div class="sideNav" id="nav"></div><div class="side-scene"></div></aside><div class="site"><header class="masthead"><div class="logo"><span class="logoMark">📖🧭</span><div><b>Читательский навигатор</b><small>Читай. Исследуй. Открывай!</small></div></div><div class="profile">👩‍🎓 <span id="profileLabel">8 класс</span></div></header><main class="mainContent" id="content"></main><footer class="footer">Развитие читательской грамотности учащихся 8 класса через стратегии аналитического чтения · Учебная рабочая версия. Открытые ответы оценивает педагог.</footer></div></div><script>
const MODULES=[{"id": 1, "title": "Наши семейные ценности", "goal": "8.3.1.1", "strategy": "Маркировка текста + поиск доказательств", "subtitle": "Что объединяет семью?", "note": "Рабочая реконструкция ранее согласованного материала: перед окончательной публикацией сверить с исходным текстом № 1.", "text": "Семейные традиции бывают разными. В одних семьях все собираются за ужином, в других — гуляют в выходные, читают вместе или рассказывают друг другу о прошедшем дне. Главное не само занятие, а внимание, которое родные уделяют друг другу.\n\nИногда взрослым и детям непросто найти время для общения. Родители поздно возвращаются с работы, школьники посещают дополнительные занятия, а телефоны отвлекают от живого разговора. Из-за этого даже люди, живущие в одном доме, могут редко обсуждать свои переживания.\n\nНебольшие повторяющиеся действия помогают поддерживать близость. Совместный ужин даёт возможность выслушать друг друга. Во время прогулки проще поделиться новостями, а чтение книги может стать поводом обсудить поступки героев.\n\nТрадиции нельзя просто назначить обязательными правилами. Они имеют смысл, если каждому человеку приятно в них участвовать. Даже короткий разговор, который повторяется каждый день, иногда важнее редкого большого праздника.\n\nСемью объединяет не количество совместных мероприятий, а доверие, которое постепенно возникает благодаря вниманию и общению.", "chart": [["Совместный ужин", 68], ["Семейные разговоры", 54], ["Совместные прогулки", 42], ["Совместное чтение", 24]], "chartnote": "Учебная модель опроса 100 подростков; данные вымышленные.", "questions": [{"type": "single", "title": "Основная мысль", "points": 1, "prompt": "Какое утверждение точнее всего передаёт основную мысль текста?", "options": ["Традиции нужны только по праздникам.", "Семейные традиции помогают укреплять отношения.", "Телефоны делают общение в семье лучше.", "Любая традиция должна быть обязательной."], "answer": 1}, {"type": "short", "title": "Поиск информации", "points": 1, "prompt": "Назовите две причины, по которым семье бывает трудно проводить время вместе.", "rubric": "1 балл — названы две причины (занятость родителей, дополнительные занятия детей, отвлечение на телефоны). 0 баллов — указана одна или нет ни одной.", "maxManual": 1}, {"type": "yn", "title": "Работа с диаграммой", "points": 2, "prompt": "Определите, верны ли утверждения по диаграмме.", "statements": ["Совместные прогулки отметили 42% опрошенных.", "Совместное чтение встречается чаще семейных разговоров."], "answers": [true, false]}, {"type": "long", "title": "Текст и данные", "points": 2, "prompt": "Выберите один вид совместного занятия из диаграммы, который помогает повседневному общению. Объясните, как данные диаграммы связаны с мыслью текста.", "rubric": "2 балла — назван вид занятия и его показатель, объяснена связь с идеей текста; 1 балл — занятие/показатель названы, но объяснение неполное; 0 — нет обоснованного сопоставления.", "maxManual": 2}]}, {"id": 2, "title": "Культура питания", "goal": "8.3.2.1", "strategy": "Факт или мнение + аналитическая таблица", "subtitle": "Едим на бегу: удобство или привычка?", "note": "Рабочая реконструкция ранее согласованного материала: перед окончательной публикацией сверить с исходным текстом № 2.", "text": "Утро современного школьника нередко начинается в спешке. Надо успеть на уроки, подготовить задания, добраться до кружка или спортивной секции. Полноценный завтрак иногда заменяет перекус по дороге.\n\nОдин восьмиклассник каждый день покупает по пути на дополнительные занятия сладкий напиток и выпечку. Это удобно: не нужно тратить время на приготовление еды. Но такой перекус не всегда заменяет разнообразный приём пищи.\n\nКонечно, не вся готовая еда вредна. Многое зависит от состава продукта, размера порции и того, что человек ест в течение дня. Важнее понимать, что именно мы выбираем, чем бездумно делить все продукты на «хорошие» и «плохие».\n\nПочему мы иногда находим время для переписки, но не можем выделить несколько минут на спокойный завтрак? Разве забота о собственном самочувствии менее важна, чем ещё одно сообщение в телефоне?\n\nНа мой взгляд, культура питания начинается не со строгих запретов, а с осознанного выбора. Заранее продумать свой день и подготовить подходящую еду разумнее, чем постоянно надеяться на случайный перекус.", "questions": [{"type": "single", "title": "Стиль и тип речи", "points": 1, "prompt": "Укажите стиль и тип речи текста.", "options": ["Научный стиль, описание", "Официально-деловой стиль, повествование", "Публицистический стиль, рассуждение с элементами повествования", "Художественный стиль, описание"], "answer": 2}, {"type": "fact", "title": "Факт или мнение", "points": 2, "prompt": "Определите характер каждого утверждения.", "statements": ["В статье описана ситуация, когда восьмиклассник покупает сладкий напиток и выпечку.", "Культура питания начинается с осознанного выбора.", "Заранее продумывать день разумнее, чем постоянно пропускать полноценный приём пищи."], "answers": ["fact", "opinion", "opinion"]}, {"type": "multi", "title": "Признаки публицистического стиля", "points": 1, "prompt": "Выберите ТРИ признака, которые есть в тексте.", "options": ["Риторические вопросы", "Формулы официального документа", "Выраженное авторское мнение", "Строгое описание лабораторного опыта", "Общественно значимая проблема"], "answers": [0, 2, 4]}, {"type": "long", "title": "Приёмы воздействия", "points": 2, "prompt": "Объясните, зачем автор использует риторические вопросы и пример восьмиклассника. Как эти приёмы воздействуют на читателя?", "rubric": "2 балла — объяснено назначение обоих приёмов с опорой на текст; 1 балл — объяснён один приём или оба неполно; 0 — пояснения нет.", "maxManual": 2}]}, {"id": 3, "title": "В. Железников «Чучело»", "goal": "8.3.3.1", "strategy": "Толстые и тонкие вопросы + Дерево предположений", "subtitle": "Почему они молчали?", "note": "Авторский учебный пересказ по мотивам повести; не дословная цитата.", "text": "Лена Бессольцева оказалась в новом классе, где ей было непросто найти друзей. Одноклассники насмехались над её внешностью и поведением. Однако девочка старалась относиться к окружающим доброжелательно.\n\nОднажды в классе произошёл неприятный случай. Ребята узнали, что учительнице стало известно об их проступке. Они решили, что кто-то рассказал взрослым о случившемся, и стали искать виновного.\n\nЛена знала, кто на самом деле сообщил учительнице правду. Но, желая защитить Диму Сомова, к которому испытывала тёплые чувства, она приняла обвинение на себя.\n\nОдноклассники поверили, что именно Лена предала их. Они перестали с ней разговаривать, насмехались над ней и старались показать своё презрение.\n\nНекоторые ребята сомневались в справедливости обвинений, но открыто не возражали. Одни боялись оказаться на месте Лены, другие не хотели идти против большинства.\n\nОсобенно тяжело девочке было видеть молчание Димы. Он знал правду, но долго не решался признаться. Страх потерять уважение одноклассников оказался сильнее желания защитить человека, который пострадал из-за него.\n\nЛена испытывала боль и одиночество, но не хотела отвечать жестокостью на жестокость.\n\nЭта история заставляет задуматься: всегда ли молчание означает согласие и почему человеку бывает трудно поступить по совести?", "questions": [{"type": "single", "title": "Мотив поступка", "points": 1, "prompt": "Почему Лена приняла обвинение на себя?", "options": ["Она хотела привлечь внимание одноклассников.", "Она боялась признаться в собственном проступке.", "Она хотела защитить Диму Сомова.", "Она не знала, кто рассказал учительнице правду."], "answer": 2}, {"type": "yn", "title": "Понимание поведения", "points": 2, "prompt": "Определите, соответствуют ли утверждения тексту.", "statements": ["Некоторые одноклассники сомневались в виновности Лены.", "Дима не знал, кто на самом деле рассказал учительнице о проступке."], "answers": [true, false]}, {"type": "single", "title": "Проблемный вопрос", "points": 1, "prompt": "Какой вопрос требует глубокого осмысления конфликта?", "options": ["Как звали девочку, которую обвиняли одноклассники?", "В каком классе училась Лена?", "Почему страх перед большинством иногда заставляет человека поступать против совести?", "Кому одноклассники рассказали о случившемся?"], "answer": 2}, {"type": "long", "title": "Своя интерпретация", "points": 2, "prompt": "Сформулируйте проблемный вопрос о поведении Димы или одноклассников. Предложите два объяснения и обоснуйте выбранное информацией текста.", "rubric": "2 балла — проблемный вопрос, два объяснения, выбор с доказательством; 1 балл — вопрос есть, но объяснение неполное или нет аргументированного выбора; 0 — нет содержательного вопроса либо связи с текстом.", "maxManual": 2}]}, {"id": 4, "title": "Космическая азбука", "goal": "8.3.4.1", "strategy": "Чтение с остановками + Вопрос к абзацу", "subtitle": "Невидимые помощники на орбите", "note": "Авторский научно-популярный учебный текст.", "text": "Каждый день люди пользуются технологиями, работа которых связана с космосом. Мы смотрим прогноз погоды, строим маршруты на телефоне, следим за изменениями земной поверхности. При этом редко задумываемся, что часть необходимой информации поступает от искусственных спутников Земли.\n\nСпутник — это созданный человеком аппарат, который движется по орбите вокруг Земли или другого небесного тела. Одни спутники помогают передавать сигналы связи, другие наблюдают за погодой, третьи собирают сведения о поверхности планеты. Например, спутниковые снимки позволяют специалистам следить за распространением лесных пожаров и изменением площади ледников.\n\nОднако освоение космоса сопровождается не только достижениями, но и новыми проблемами. После завершения работы некоторые аппараты остаются на орбите. Там же могут находиться обломки ракет и разрушенных спутников. Такие объекты называют космическим мусором.\n\nДаже небольшой фрагмент космического мусора представляет опасность для работающего спутника. Дело в том, что объекты на орбите могут двигаться с очень высокой скоростью. При столкновении они способны повредить оборудование и создать дополнительные обломки.\n\nУчёные и инженеры разрабатывают способы уменьшения количества космического мусора. Один из подходов — заранее планировать безопасное завершение работы спутника. Например, некоторые аппараты после окончания службы направляют в плотные слои атмосферы, где они разрушаются.\n\nТаким образом, космические технологии не только расширяют возможности человечества, но и требуют ответственного отношения к околоземному пространству. Ведь будущее космических исследований зависит в том числе от того, насколько разумно люди будут использовать уже освоенные орбиты.", "questions": [{"type": "single", "title": "Основная мысль", "points": 1, "prompt": "Какое утверждение отражает основную мысль текста?", "options": ["Спутники используют только для погоды.", "Космический мусор исключает освоение космоса.", "Космические технологии полезны, но требуют ответственности.", "Все спутники возвращаются на Землю."], "answer": 2}, {"type": "yn", "title": "Нахождение информации", "points": 2, "prompt": "Определите, соответствуют ли утверждения тексту.", "statements": ["Спутниковые снимки используют для наблюдения за лесными пожарами.", "Все спутники после завершения работы сразу исчезают с орбиты."], "answers": [true, false]}, {"type": "single", "title": "Связь между частями", "points": 1, "prompt": "Почему после описания пользы спутников автор говорит о мусоре?", "options": ["Чтобы доказать бесполезность спутников.", "Чтобы показать преимущества и проблемы освоения космоса.", "Чтобы объяснить устройство ракеты.", "Чтобы сравнить планеты."], "answer": 1}, {"type": "long", "title": "Причина и следствие", "points": 2, "prompt": "Почему увеличение космического мусора создаёт трудности для будущих исследований? Объясните с опорой на текст.", "rubric": "2 балла — показаны опасность столкновений и последствия повреждений/новых обломков; 1 балл — названа опасность без полного объяснения; 0 — неверный ответ.", "maxManual": 2}]}, {"id": 5, "title": "Л. Кассиль «Ход белой королевы»", "goal": "8.3.5.1", "strategy": "Смысловые части + Цитата как доказательство", "subtitle": "Путь к победе", "note": "Адаптированный пересказ эпизодов XIII главы «Болеро» и «Шестеро». Подлинные короткие цитаты сохранены.", "text": "Степан Михайлович Чудинов пришёл в интернат, где Наташа занималась с детьми музыкой. Раньше между тренером и девушкой возникали разногласия. Наташа не всегда соглашалась с его замечаниями, а Чудинов считал, что её спортивный талант требует серьёзной работы. Теперь он решил первым сделать шаг к примирению. Протянув Наташе руку, тренер произнёс: «Руку!» Девушка согласилась возобновить занятия.\n\nНачались ежедневные тренировки. Чудинов внимательно следил за техникой Наташи и требовал, чтобы она использовала все силы, особенно перед финишем. Девушка уставала, иногда сердилась на тренера, но постепенно становилась настойчивее. Когда Чудинов предложил закончить очередную тренировку, она возразила: «Я хочу тренироваться». Теперь Наташа сама стремилась преодолевать трудности.\n\nОднажды после тренировки Чудинов пригласил Наташу на концерт. Они слушали «Болеро» Равеля и Пятую симфонию Чайковского. Тренер услышал в нарастающем музыкальном ритме сходство со спортивной борьбой: постепенное напряжение сил и решающий рывок к финишу. Музыка помогла ему выразить своё понимание победы. Взволнованный Чудинов произнёс: «Победа близка!»\n\nНаташа тоже была глубоко тронута музыкой, хотя представляла себе не только спортивный успех, но и счастливое будущее рядом с близким человеком.", "questions": [{"type": "single", "title": "Основная мысль", "points": 1, "prompt": "Какая мысль передана через историю Наташи?", "options": ["Музыка нужна спортсменам только для отдыха.", "Упорство, тренировки и поддержка наставника помогают двигаться к цели.", "Успех зависит только от таланта.", "Наташа интересовалась музыкой больше спорта."], "answer": 1}, {"type": "single", "title": "Последовательность событий", "points": 1, "prompt": "Какова последовательность событий?", "options": ["Концерт → примирение → тренировки", "Тренировки → концерт → примирение", "Примирение → тренировки → концерт", "Примирение → концерт → тренировки"], "answer": 2}, {"type": "yn3", "title": "Соответствие цитат", "points": 2, "prompt": "Соответствует ли цитата указанной смысловой части?", "statements": ["«Руку!» — примирение тренера и Наташи.", "«Я хочу тренироваться» — отказ Наташи продолжать занятия.", "«Победа близка!» — вера тренера в достижение цели."], "answers": [true, false, true]}, {"type": "plan", "title": "Цитатный план", "points": 2, "prompt": "Составьте три пункта цитатного плана: примирение, стремление тренироваться, вера в победу.", "rubric": "2 балла — три соответствующие цитаты в порядке событий; 1 балл — две цитаты соответствуют смысловым частям и расположены последовательно; 0 — менее двух.", "maxManual": 2}]}, {"id": 6, "title": "А. П. Чехов «Сирена»", "goal": "8.3.6.1", "strategy": "Стратегия Исикавы (Рыбья кость)", "subtitle": "Необычное совещание", "note": "Адаптированный пересказ рассказа, сохраняющий последовательность событий.", "text": "После судебного заседания несколько чиновников собрались в совещательной комнате. Все устали и хотели отправиться домой обедать. Однако председатель задержался: ему необходимо было закончить письменное изложение своего особого мнения по рассмотренному делу.\n\nПока присутствующие ожидали окончания работы, секретарь Жилин завёл разговор о еде. Он с большим удовольствием рассказывал, каким должен быть настоящий обед. Сначала его речь казалась обычной беседой, но постепенно становилась всё более подробной и увлекательной.\n\nЖилин описывал разнообразные блюда, их запах, вкус и способы приготовления. Он говорил так выразительно, что слушатели словно представляли перед собой накрытый стол.\n\nПредседатель пытался сосредоточиться на документе, но секретарь постоянно отвлекал его. Несколько раз maxManual": 2}]}, {"id": 7, "title": "Уникальные свойства воды", "goal": "8.3.7.1", "strategy": "Рассмотри все факторы", "subtitle": "Почему озеро не промерзает до самого дна?", "note": "СИТУАЦИЯ. Восьмиклассники готовят стенд «Удивительные свойства воды». Почему зимой лёд образуется на поверхности озера, а под ним продолжается жизнь?. Источник А — учебный пересказ научных сведений USGS; Б и В — специально созданные учебные материалы.", "text": "СИТУАЦИЯ. Восьмиклассники готовят стенд «Удивительные свойства воды». Почему зимой лёд образуется на поверхности озера, а под ним продолжается жизнь?\n\nИСТОЧНИК А. Научно-популярная статья. При охлаждении вода изменяет плотность. У пресной воды наибольшая плотность наблюдается примерно при +4 °C. Лёд менее плотный, чем жидкая вода, поэтому не тонет. В холодное время года лёд образует верхний слой водоёма. Вода под ним может оставаться жидкой.\n\nИСТОЧНИК Б. Запись школьного наблюдения (учебный пример). Ученик поместил кубики льда в стакан воды. Они остались на поверхности. Он предположил, что поэтому лёд образуется сверху на озере. Однако измерения температуры и плотности не проводились.\n\nИСТОЧНИК В. Публикация в социальной сети (вымышленная): «Учёные скрывают удивительный факт! Лёд тяжелее воды и всегда опускается на дно. Не верьте учебникам!» Имя автора не указано, научных ссылок нет.", "questions": [{"type": "single", "title": "Научный факт", "points": 1, "prompt": "Согласно источнику А, почему лёд плавает?", "options": ["В нём больше тепла.", "Его плотность меньше плотности воды.", "Вода выталкивает его только при +4 °C.", "Лёд образуется на дне."], "answer": 1}, {"type": "yn", "title": "Сопоставление источников", "points": 2, "prompt": "Соответствуют ли утверждения источникам?", "statements": ["Источники А и Б согласуются в том, что лёд плавает на воде.", "Источник В приводит ссылки на исследования."], "answers": [true, false]}, {"type": "single", "title": "Достоверность", "points": 1, "prompt": "Почему публикация В чаться от свойств того же материала в более крупной форме.\n\nОдно из направлений применения нанотехнологий — производство тканей с дополнительными свойствами. Например, некоторые наноматериалы используют для создания покрытий, уменьшающих смачивание ткани водой. Другие применяют при разработке материалов с антибактериальными свойствами.\n\nОднако эффективность таких технологий зависит от состава покрытия, способа его нанесения и условий использования изделия. Некоторые наноматериалы могут выделяться из ткани во время стирки или изнашивания, поэтому исследователи изучают их возможное воздействие на окружающую среду.\n\nТаким образом, нанотехнологии открывают новые возможности для производства материалов, но требуют научной проверки эффективности и безопасности.\n\nТЕКСТ Б. «Откройте для себя ткань будущего!» Представьте одежду, которая помогает вам чувствовать себя комфортно даже в непредсказуемую погоду!\n\nСовременные разработки в области нанотехнологий позволяют создавать ткани со специальными покрытиями, которые уменьшают смачивание поверхности водой.\n\nРазве не удивительно, что невидимые глазу технологии могут изменить привычные вещи?\n\nТкань нового поколения — это сочетание науки, удобства и современных решений!\n\nУзнайте больше о возможностях нанотехнологий и откройте для себя мир инновационных материалов.\n\nПри выборе подобных изделий обращайте внимание на подтверждённые характеристики и рекомендации производителя.", "questions": [{"type": "single", "title": "Общая информация", "points": 1, "prompt": "Какое утверждение верно для обоих текстов?", "options": ["Нанотехнологии гарантируют безопасность.", "Нанотехнологии позволяют изменять свойства тканей.", "Наноматериалы невозможно использовать в быту.", "Все ткани с нанопокрытием полностью водонепроницаемы."], "answer": 1}, {"type": "yn", "title": "Сходства и различия", "points": 2, "prompt": "Соответствуют ли утверждения содержанию?", "statements": ["Оба текста сообщают о применении нанотехнологий в тканях.", "Оба текста подробно обсуждают влияние наноматериалов на окружающую среду."], "answers": [true, false]}, {"type": "single", "title": "Языковые средства", "points": 1, "prompt": "Какое сравнение наиболее точное?", "options": ["В А — эмоциональные обращения, в Б — научные определения.", "Оба текста состоят только из терминов.", "В А — термины и объяснения, в Б — эмоции, риторический вопрос и призывы.", "В обоих нет средств воздействия."], "answer": 2}, {"type": "long", "title": "Цель и язык", "points": 2, "prompt": "Почему в тексте А используются термины, а в тексте Б — эмоции и вопросы? Сравните цели и приведите по одному языковому примеру.", "rubric": "2 балла — объяснены разные цели и приведён пример языка из каждого текста; 1 балл — цели объяснены, но примеры неполные; 0 — нет сравнения.", "maxManual": 2}], "textA": "«Как нанотехнологии изменяют свойства материалов». Нанотехнологии позволяют исследовать и изменять материалы на уровне мельчайших частиц. Обычно речь идёт о структурах размером примерно от 1 до 100 нанометров. На таком уровне свойства вещества могут отличаться от свойств того же материала в более крупной форме.\n\nОдно из направлений применения нанотехнологий — производство тканей с дополнительными свойствами. Например, некоторые наноматериалы используют для создания покрытий, уменьшающих смачивание ткани водой. Другие применяют при разработке материалов с антибактериальными свойствами.\n\nОднако эффективность таких технологий зависит от состава покрытия, способа его нанесения и условий использования изделия. Некоторые наноматериалы могут выделяться из ткани во время стирки или изнашивания, поэтому исследователи изучают их возможное воздействие на окружающую среду.\n\nТаким образом, нанотехнологии открывают новые возможности для производства материалов, но требуют научной проверки эффективности и безопасности.", "textB": "«Откройте для себя ткань будущего!» Представьте одежду, которая помогает вам чувствовать себя комфортно даже в непредсказуемую const STORAGE='chitatelskiy_navigator_bright_v1';let state={};try{state=JSON.parse(localStorage.getItem(STORAGE))||{}}catch{}state.answers??={};state.marks??={};state.checked??={};state.profile??={name:'',klass:'8'};state.seen??={};let page='home',unit=1,question=0,textTab=0;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}function id(s,q){return s+'_'+q}function answer(s,q){return state.answers[id(s,q)]}function setAnswer(s,q,v){state.answers[id(s,q)]=v;state.checked[s]=false;save()}
function automated(q,a){if(a===undefined||a===null||a===''||(Array.isArray(a)&&a.some(x=>x===''||x===null)))return null;switch(q.type){case'single':return +a===q.answer?1:0;case'multi':return JSON.stringify([...a].sort((x,y)=>x-y))===JSON.stringify(q.answers)?1:0;case'yn':{let hits=q.answers.filter((v,i)=>String(v)===a[i]).length;return hits}case'yn3':case'fact':{let hits=q.answers.filter((v,i)=>q.type==='fact'?v===a[i]:String(v)===a[i]).length;return hits===3?2:hits===2?1:0}default:return null}}
function score(n){let d=MODULES[n-1],total=0,complete=0,autograde=0,manual=0;d.questions.forEach((q,i)=>{if(['short','long','plan'].includes(q.type)){let v=state.marks[id(n,i)];if(v!==undefined&&v!==null&&v!==''){total+=+v;manual+=+v;complete++}}else{let a=automated(q,answer(n,i));if(a!==null&&state.checked[n]){total+=a;autograde+=a;complete++}}});return {total,complete,autograde,manual,done:complete===4}}function overall(){let a=MODULES.map(d=>score(d.id));return {done:a.filter(x=>x.done).length,total:a.reduce((n,x)=>n+x.total,0),assessed:a.reduce((n,x)=>n+x.complete,0)}}
function nav(){let items=[['home','⌂','Главная'],['modules','▤','Модули'],['diagnostics','☑','Диагностика'],['results','▥','Результаты'],['profile','◉','Профиль']];$('#nav').innerHTML=items.map(([key,icon,text])=>`<button class="nav ${page===key||(page==='unit'&&key==='modules')?'active':''}" data-page="${key}"><span class="ico">${icon}</span>${text}</button>`).join('');$$('[data-page]').forEach(el=>el.onclick=()=>go(el.dataset.page));$('#profileLabel').textContent=(state.profile.name?state.profile.name+' · ':'')+(state.profile.klass||'8')+' класс'}

function modCard(d){let n=d.id;const s=score(n),p=PALETTES[n-1],percent=Math.round(s.total/6*100);return `<article class="module" style="--bg:${p[0]};--accent:${p[1]}"><div class="modVisual"><img src="${IMAGES[n-1]}" alt="Иллюстрация к теме ${escapeHtml(d.title)}"><span class="modNumber">${n}</span></div><div class="moduleBody"><h3>${escapeHtml(d.title)}</h3><div class="detail">Цель ${escapeHtml(d.goal)} · 4 задания</div><div class="grade"><span>⭐ ${s.total} / 6 баллов</span><span>${percent}%</span></div><div class="bar"><span style="width:${percent}%"></span></div><button class="btn ${s.done?'teal':s.complete?'':'teal'} small" data-open="${n}">${s.done?'✓ Пройдено':s.complete?'▶ Продолжить':'▶ Начать'}</button></div></article>`}
function home(justModules=false){let o=overall();let main=`${!justModules?`<section class="heroGrid"><div class="hero"><div class="heroArt"></div><h1>8 увлекательных маршрутов по миру текстов</h1><p>Исследуй тексты, находи доказательства и открывай новое!</p><span class="heroSpark">✦ ✨ ✦</span></div><div class="whiteCard progressPanel"><div class="progressTitle">📊 Мой прогресс <span style="font-size:12px">${o.done} из 8 модулей</span></div><div class="bar"><span style="width:${o.done/8*100}%"></span></div><div class="stats"><div class="stat">📖 Пройдено <strong>${o.done}/8</strong></div><div class="stat">⭐ Баллы <strong>${o.total}</strong></div></div><button class="btn" id="continue">▶ Продолжить обучение</button></div></section>`:''}<h2 class="sectionTitle">🪧 Модули — выбирай маршрут и отправляйся в путешествие!</h2><div class="modules">${MODULES.map(modCard).join('')}</div><div class="whiteCard" style="margin-top:17px"><b>📌 Как работать с тренажёром</b><p class="smallText">Прочитай текст и выполни четыре задания. Закрытые ответы проверяются после нажатия «Проверить», открытые ответы оценивает учитель по критериям. Каждый комплект — до 6 баллов, все восемь — до 48.</p><p class="smallText">Комплекты № 1–2 содержат восстановленные учебные версии текстов и требуют сверки с исходными утверждёнными материалами перед использованием для исследования.</p></div>`;$('#content').innerHTML=main;$$('[data-open]').forEach(el=>el.onclick=()=>{question=0;go('unit',+el.dataset.open)});if($('#continue'))$('#continue').onclick=()=>{let item=MODULES.find(d=>!score(d.id).done);question=0;go('unit',item?item.id:1)}}
function chart(d){if(!d.chart)return'';return `<div class="whiteCard" style="margin-top:12px"><h3>📊 Данные опроса</h3>${d.chart.map(([name,value])=>`<div class="chartLine"><span>${escapeHtml(name)}</span><div class="bar"><span style="width:${value}%"></span></div><b>${value}%</b></div>`).join('')}<div class="smallFoot">${escapeHtml(d.chartnote)}</div></div>`}
function article(d){let note=d.note||'';let article=escapeHtml(d.text||'');let text='';if(d.sources){text=d.sources.map((source,i)=>`<section class="sourceBlock"><h3>Источник ${'АБВ'[i]} · ${escapeHtml(source.title||'')}</h3><div class="reading">${escapeHtml(source.text||'')}</div></section>`).join('')}else if(d.textA&&d.textB){text=`<div class="tabs"><button data-tab="0" class="${textTab===0?'active':''}">Текст А</button><button data-tab="1" class="${textTab===1?'active':''}">Текст Б</button><button data-tab="2" class="${textTab===2?'active':''}">Оба текста</button></div>${textTab===0||textTab===2?`<div class="sourceBlock"><h3>Текст А</h3><div class="reading">${escapeHtml(d.textA)}</div></div>`:''}${textTab===1||textTab===2?`<div class="sourceBlock"><h3>Текст Б</h3><div class="reading">${escapeHtml(d.textB)}</div></div>`:''}`}else{text=`<div class="reading">${article}</div>`}return `<article class="whiteCard textSection"><h2>📖 ${escapeHtml(d.subtitle||'Текст для чтения')}</h2><p class="note">${escapeHtml(note)}</p>${text}</article>${chart(d)}`}
function questionHtml(d,i){let q=d.questions[i],a=answer(d.id,i);let h='';if(q.type==='single')h=q.options.map((op,j)=>`<label class="choice ${state.checked[d.id]&&a!==undefined?(j===q.answer?'answer-correct':String(a)===String(j)?'answer-wrong':''):''}"><input type="radio" name="answer" value="${j}" ${String(a)===String(j)?'checked':''}><span><b>${'АБВГД'[j]}.</b> ${escapeHtml(op)}</span></label>`).join('');else if(q.type==='multi')h=q.options.map((op,j)=>`<label class="choice ${state.checked[d.id]&&Array.isArray(a)?(q.answers.includes(j)?'answer-correct':a.includes(j)?'answer-wrong':''):''}"><input type="checkbox" name="answer" value="${j}" ${(a||[]).includes(j)?'checked':''}><span><b>${'АБВГД'[j]}.</b> ${escapeHtml(op)}</span></label>`).join('');else if(['yn','yn3','fact'].includes(q.type))h=q.statements.map((st,j)=>`<div class="miniStatement ${state.checked[d.id]&&(a||[])[j]!==undefined?((q.type==='fact'?q.answers[j]===a[j]:String(q.answers[j])===a[j])?'answer-correct':'answer-wrong'):''}"><b>${j+1}.</b> ${escapeHtml(st)}<div class="rowOptions">${(q.type==='fact'?[['fact','Факт'],['opinion','Мнение']]:[['true','Да'],['false','Нет']]).map(([v,txt])=>`<label><input type="radio" name="sub_${j}" value="${v}" ${(a||[])[j]===v?'checked':''}> ${txt}</label>`).join('')}</div></div>`).join('');else if(q.type==='plan')h=[0,1,2].map(j=>`<div class="formRow"><label>${j+1}. <input class="plan" data-plan="${j}" value="${escapeHtml((a||[])[j]||'')}" placeholder="Вставьте цитату из текста"></label></div>`).join('');else h=`<textarea id="openAnswer" class="answerArea" placeholder="Напишите свой ответ...">${escapeHtml(a||'')}</textarea>`;let mark=state.marks[id(d.id,i)];let check=state.checked[d.id];let auto=automated(q,a);let feedback=check&&auto!==null?`<div class="feedback ${auto===q.points?'feedback-correct':'feedback-wrong'}">${auto===q.points?'✓ Верно!':'✕ Есть ошибка.'} Закрытый ответ проверен: <b>${auto} из ${q.points}</b> балл(ов).</div>`:'';let manual=['short','long','plan'].includes(q.type)?`<div class="scoreMark"><b>📝 Оценивание открытого ответа</b><p>${escapeHtml(q.rubric||'')}</p><label>Баллы учителя: <select id="manualScore"><option value="">Не оценено</option>${Array.from({length:q.points+1},(_,j)=>`<option value="${j}" ${String(mark)===String(j)?'selected':''}>${j}</option>`).join('')}</select> / ${q.points}</label><p>Открытые ответы проверяет учитель; автоматическая оценка не применяется.</p></div>`:'';let reason='';if(check&&auto!==null){let key=q.type==='single'?'Вариант '+('АБВГД'[q.answer]):q.type==='multi'?q.answers.map(x=>'АБВГД'[x]).join(', '):q.type==='fact'?q.answers.map(x=>x==='fact'?'Факт':'Мнение').join(' — '):q.answers.map(x=>x?'Да':'Нет').join(' — ');reason=`<details style="margin-top:10px"><summary class="smallText">Показать ключ ответа</summary><div class="feedback">${escapeHtml(key)}</div></details>`}return `<div class="questionHeader"><h2>❔ Вопрос ${i+1}. ${escapeHtml(q.title)}</h2><span class="chip gold">⭐ ${q.points} балл.</span></div><div class="questionPrompt">${escapeHtml(q.prompt)}</div>${h}${feedback}${reason}${manual}`}
function extraStrategy(d){let name=d.strategy;let body=`<div class="smallText" style="line-height:1.7">Прочитай текст, найди ключевые сведения и аргументы. После выполнения тренировочной стратегии переходи к самостоятельной проверке понимания.</div>`;if(d.id===8)body=`<p class="smallText">Соотнеси карточки со значением: какие сведения относятся к обоим текстам, какие — только к А или Б?</p><div class="strategyGrid"><div class="strategyTile">Общее</div><div class="strategyTile">Текст А</div><div class="strategyTile">Текст Б</div></div><div class="smallChart"><div class="factCard">Применение нанотехнологий в тканях</div><div class="factCard">Научные термины и ограничения</div><div class="factCard">Риторический вопрос и призывы</div></div><p class="smallText">Объясни свой выбор примерами из текстов.</p>`;else if(d.id===7)body=`<div class="factCard">Проверь: авторство · доказательства · актуальность · полезность · ценность</div>`;else if(d.id===6)body=`<div class="factCard">Причины → события → последствия → комический эффект</div>`;else if(d.id===5)body=`<div class="factCard">Смысловая часть → ключевое событие → цитата</div>`;else if(d.id===4)body=`<div class="factCard">После абзацев 2, 4 и 6 сделай остановки и сформулируй вопрос.</div>`;return `<div class="whiteCard" style="margin-top:14px"><h3 style="margin:0 0 9px">🎯 Стратегия</h3><b style="color:#602bb0">${escapeHtml(name)}</b><div style="margin-top:10px">${body}</div></div>`}
function renderUnit(){let d=MODULES[unit-1],q=d.questions[question];let p=PALETTES[unit-1];let completed=score(unit);$('#content').innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><button class="headerBack" id="backModules">←</button><span class="kicker">МОДУЛЬ ${unit} ИЗ 8 · ЦЕЛЬ ${escapeHtml(d.goal)}</span></div><header class="unitHero"><div><span class="chip">📘 Чтение и исследование</span><h1>${escapeHtml(d.title)}</h1><span class="chip gold">⭐ Всего 6 баллов</span></div><div class="unitArt" style="background-image:url('${IMAGES[unit-1]}');background-color:${p[0]}"></div></header><div class="whiteCard" style="margin:14px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px"><div><b>Задание ${question+1} из 4</b><p class="micro" style="margin:3px 0">${completed.total} / 6 баллов · оценено ${completed.complete} из 4</p></div><div class="stepper">${d.questions.map((q,i)=>`<button data-q="${i}" class="${question===i?'active':answer(unit,i)!==undefined?'done':''}">${i+1}</button>`).join('')}</div></div><div class="twoColumns"><div>${article(d)}</div><div><div class="whiteCard questionBox">${questionHtml(d,question)}<div class="controls"><button class="btn outline small" id="prevQuestion">← Назад</button><button class="btn small" id="checkQuestion">${question===3?'Проверить ответы':'Проверить ответы'}</button><button class="btn teal small" id="nextQuestion">${question===3?'К результатам':'Следующее →'}</button></div></div>${extraStrategy(d)}</div></div>`;$('#backModules').onclick=()=>go('modules');$$('[data-q]').forEach(x=>x.onclick=()=>{question=+x.dataset.q;renderUnit()});$('#prevQuestion').onclick=()=>{if(question>0){question--;renderUnit()}else go('modules')};$('#nextQuestion').onclick=()=>{if(question<3){question++;renderUnit()}else go('results')};$('#checkQuestion').onclick=()=>{state.checked[unit]=true;save();renderUnit()};$$('input[name="answer"]').forEach(el=>el.onchange=()=>{if(q.type==='single')setAnswer(unit,question,el.value);else setAnswer(unit,question,$$('input[name="answer"]:checked').map(x=>+x.value))});if(['yn','yn3','fact'].includes(q.type))$$('[name^="sub_"]').forEach(el=>el.onchange=()=>{let i=+el.name.split('_')[1];let a=[...(answer(unit,question)||Array(q.statements.length).fill(''))];a[i]=el.value;setAnswer(unit,question,a)});if($('#openAnswer'))$('#openAnswer').oninput=el=>setAnswer(unit,question,el.target.value);$$('[data-plan]').forEach(el=>el.oninput=()=>{let j=+el.dataset.plan;let a=[...(answer(unit,question)||['','',''])];a[j]=el.value;setAnswer(unit,question,a)});if($('#manualScore'))$('#manualScore').onchange=e=>{state.marks[id(unit,question)]=e.target.value;save();renderUnit()};$$('[data-tab]').forEach(x=>x.onclick=()=>{textTab=+x.dataset.tab;renderUnit()})}
function results(){let o=overall();let rows=MODULES.map(d=>({d,s:score(d.id)}));let percent=Math.round(o.total/48*100);$('#content').innerHTML=`<div class="scoreHero"><div><div class="eyebrow">МОИ ДОСТИЖЕНИЯ</div><h1>🏆 Результаты и достижения</h1><p>Твой прогресс в мире текстов</p></div><div class="whiteCard" style="min-width:245px"><div class="smallText">⭐ Общий результат</div><div class="scoreBig">${o.total} из 48</div><div class="bar"><span style="width:${percent}%"></span></div><div style="text-align:right;color:#6724ad;font-weight:800">${percent}%</div></div></div><div class="statBoard"><div class="whiteCard"><div class="micro">📚 Пройдено модулей</div><div class="bigmetric">${o.done} из 8</div></div><div class="whiteCard"><div class="micro">✅ Оценено заданий</div><div class="bigmetric">${o.assessed} из 32</div></div><div class="whiteCard"><div class="micro">🎯 Баллы</div><div class="bigmetric">${o.total} / 48</div></div></div><div class="twoColumns" style="margin-top:15px"><section class="whiteCard"><h2>📊 Результаты по модулям</h2><div class="barChart">${rows.map(({d,s})=>`<div class="barColumn"><b>${Math.round(s.total/6*100)}%</b><div class="barStick" style="height:${Math.max(4,s.total/6*130)}px"></div><span>${d.id}</span></div>`).join('')}</div><p class="micro">Столбцы показывают количество выставленных баллов; неоценённые ответы не включены.</p><div class="badgeShelf"><span>📖 Исследователь текста</span><span>🔎 Аналитик</span><span>⭐ Юный эксперт</span></div></section><section class="whiteCard"><h2>📋 Результаты по маршрутам</h2>${rows.map(({d,s})=>`<div class="resultsRow"><a href="#" data-open="${d.id}">${d.id}. ${escapeHtml(d.title)}</a><b>${s.total}/6</b><span class="chip ${s.done?'':'chipflag'}">${s.done?'✓ Готово':s.complete+'/4'}</span></div>`).join('')}</section></div><div class="whiteCard" style="margin-top:15px"><div class="teacherBox">👩‍🏫 <b>Рекомендация учителя:</b> возвращайся к тексту и находи точные доказательства для каждого вывода. Для исследовательской оценки эффективности стратегий используйте отдельные входную и итоговую диагностики.</div><div class="controls"><button class="btn" id="csv">⬇ Скачать отчёт CSV</button><button class="btn teal" id="continue">▶ Продолжить</button><button class="btn outline" id="print">🖨 Печать</button><button class="btn danger small" id="reset">Сбросить ответы</button></div></div>`;$$('[data-open]').forEach(el=>el.onclick=e=>{e.preventDefault();question=0;go('unit',+el.dataset.open)});$('#csv').onclick=csv;$('#continue').onclick=()=>{let missing=MODULES.find(d=>!score(d.id).done);question=0;go('unit',missing?missing.id:1)};$('#print').onclick=()=>window.print();$('#reset').onclick=()=>{if(confirm('Удалить все ответы и выставленные баллы в этом браузере?')){state.answers={};state.marks={};state.checked={};save();results()}}}
function csv(){let rows=[['Имя','Класс','№','Комплект','Цель','Баллы','Максимум','Оценено заданий']];MODULES.forEach(d=>{let s=score(d.id);rows.push([state.profile.name,state.profile.klass,d.id,d.title,d.goal,s.total,6,s.complete])});let raw='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\r\n');let b=new Blob([raw],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download='chitatelskiy_navigator_8_klass_rezultaty.csv';a.click();URL.revokeObjectURL(url)}
function profile(){$('#content').innerHTML=`<div class="unitHero"><div><span class="chip">👩‍🎓 УЧЕНИК</span><h1>Мой профиль</h1><p class="subtle">Имя отображается в интерфейсе и в файле отчёта.</p></div><div style="font-size:65px;text-align:center">📘⭐</div></div><div class="whiteCard" style="max-width:550px"><div class="profileForm"><label><b>Имя ученика</b><input id="studentName" value="${escapeHtml(state.profile.name)}" placeholder="Фамилия и имя"></label><label><b>Класс</b><input id="studentClass" value="${escapeHtml(state.profile.klass)}" placeholder="8"></label><button class="btn" id="saveProfile">Сохранить профиль</button></div><p class="smallFoot">Данные и ответы хранятся только в браузере этого устройства. Для переноса результатов скачайте CSV.</p></div>`;$('#saveProfile').onclick=()=>{state.profile.name=$('#studentName').value.trim();state.profile.klass=$('#studentClass').value.trim()||'8';save();nav();alert('Профиль сохранён')}}
function diagnostics(){$('#content').innerHTML=`<div class="unitHero"><div><span class="chip">🔍 ИССЛЕДОВАНИЕ</span><h1>Диагностика</h1><p class="subtle">Входная и итоговая проверка читательской грамотности.</p></div><div style="font-size:76px;text-align:center">📈</div></div><div class="whiteCard"><h2>Диагностический модуль</h2><p>Восемь учебных маршрутов готовы. Для достоверного сравнения результатов до и после обучения необходимо добавить два сопоставимых набора диагностических текстов и заданий.</p><div class="empty">🚧 Диагностические комплекты ещё не утверждены и не добавлены. Приложение не подменяет их тренировочными заданиями и не показывает вымышленные результаты.</div></div>`}

(function normalizeSources(){MODULES.forEach(d=>{if(d.id===7&&d.sources&&!d.text){d.text=''}})})();go('home');
